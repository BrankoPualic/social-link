<app-navigation />

<div class="create-post-container">
  <div class="create-post-card">
    <div class="create-post-header">
      <h2>Create a new post</h2>
      <p>Share a moment with your followers.</p>
    </div>

    <form class="create-post-form" [formGroup]="form">

      <div class="mb-3 d-flex flex-column">
        <div class="d-flex flex-md-row flex-column align-items-md-center">
          <label class="col-12 col-md-3">Media</label>

          <div class="col-12 col-md-9">
            <input type="file"
                   class="form-control"
                   (change)="onFileChange($event)"
                   multiple
                   accept="image/*" />
          </div>
        </div>
      </div>

      <div class="mb-3 d-flex flex-md-row flex-column">
        <label class="col-12 col-md-3">Media Preview</label>
        <div class="col-12 col-md-9 p-1 preview-container">
          @if (previews.length === 0)
          {
          <div class="preview-empty">
            <i class="fa-regular fa-image"></i>
            <span>No file uploaded</span>
          </div>
          }
          @for(preview of previews; track $index)
          {
          <div class="preview-item anim-pop" [style.animation-delay]="($index * 50) + 'ms'">
            <span class="file-remove" (click)="removeFile($index)">
              <i class="fa-solid fa-xmark"></i>
            </span>
            <img [src]="preview" alt="Preview" />
          </div>
          }
        </div>
      </div>

      <app-text-area [formControl]="$any(form.controls['description'])"
                     [label]="'Description'"
                     [validation]="'Description'"
                     [maxLength]="500" />

      <div class="mb-3 d-flex flex-column">
        <div class="d-flex flex-row align-items-center">
          <label class="col-11 col-md-3 pointer" for="allowComments">
            Allow Comments
          </label>

          <div class="form-check form-switch float-end">
            <input class="form-check-input" type="checkbox" id="allowComments" formControlName="allowComments" style="cursor: pointer" />
          </div>
        </div>
      </div>

      <div appValidation="Post" class="mb-3"></div>

      <div class="create-post-actions">
        <button class="btn btn-outline-primary" [routerLink]="['/profile', userId]">Cancel</button>
        <button class="btn btn-primary" (click)="submit()">Create</button>
      </div>

    </form>
  </div>
</div>
