<div class="auth-background">
  <form [formGroup]="form" class="login-form">
    <div class="mb-3 text-center auth-logo">
      <img src="../../../../../assets/images/logo-pink.svg" alt="Pink logo" />
    </div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-subtitle">Log in to continue to your feed</div>

    <app-input-text [formControl]="$any(form.controls['email'])"
                    [label]="'Email'"
                    [required]="true"
                    [validation]="'Email'" />

    <app-input-text [formControl]="$any(form.controls['password'])"
                    [label]="'Password'"
                    [type]="'password'"
                    [required]="true"
                    [validation]="'Password'" />

    <div appValidation="User"></div>

    <div class="form-btn-group mt-4">
      <button class="btn btn-primary" (click)="submit()">Log in</button>
    </div>

    <div class="col-12 mt-4 text-center auth-switch">
      Don't have an account? <a [routerLink]="['/auth/signup']">Sign up</a>
    </div>
  </form>
</div>
