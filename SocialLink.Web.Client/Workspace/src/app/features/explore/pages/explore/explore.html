<app-navigation />

<div class="explore-container">
  <div class="explore-search-wrap">
    <app-search (onSearch)="onSearch($event)" [placeholder]="'Search people and posts'" />
  </div>

  <div class="explore-body">
    @if (isSearching)
    {
    <app-users [keyword]="keyword()" (onClick)="goToProfile($event)" />
    }
    @else
    {
    <app-posts />
    }
  </div>
</div>
