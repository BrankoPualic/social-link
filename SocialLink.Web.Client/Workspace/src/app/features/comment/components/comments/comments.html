<div class="position-relative h-100">
  <app-page-loader [containerLoader]="commentsLoading" />

  <div class="comments-list">
    @for (comment of comments; track $index)
    {
    <div class="comment-item anim-rise" [style.animation-delay]="($index * 30) + 'ms'">
      <div class="comment-avatar pointer" [routerLink]="['/profile', comment?.user?.id]">
        <img [src]="sharedService.getImage(comment?.user?.profileImage)" alt="User image" />
      </div>

      <div class="comment-body">
        <div class="comment-header">
          <span class="comment-username pointer" [routerLink]="['/profile', comment?.user?.id]">
            {{ comment?.user?.username }}
          </span>
          <span class="comment-time">{{ comment?.createdOn | date: 'short' }}</span>
        </div>

        <div class="comment-text" [innerHtml]="comment?.message | formatText"></div>

        <div class="comment-actions">
          <button class="comment-action" [class.is-liked]="comment?.isLiked" (click)="likeComment(comment?.id)">
            <app-heart-icon [status]="comment?.isLiked" />
            <span>{{ comment?.likesCount || 0 }}</span>
          </button>
          <span class="comment-action">
            <i class="fa-regular fa-comment-dots"></i>
            <span>{{ comment?.repliesCount || 0 }}</span>
          </span>
        </div>
      </div>
    </div>
    }
    @if (comments.length === 0)
    {
    <div class="comments-empty">
      <i class="fa-regular fa-comment-dots"></i>
      <span>No comments yet — be the first to start the conversation.</span>
    </div>
    }
  </div>
</div>
