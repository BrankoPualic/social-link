<app-navigation />

<div class="admin-container">
  <div class="admin-header">
    <h2><i class="fa-solid fa-shield-halved"></i> Admin Dashboard</h2>
    <p>Overview of platform activity and content.</p>
  </div>

  <div class="admin-stats">
    <div class="stat-card pointer anim-rise" routerLink="/admin/users">
      <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
      <div class="stat-meta">
        <div class="stat-label">Total users</div>
        <div class="stat-value">{{ userCount }}</div>
      </div>
      <i class="fa-solid fa-arrow-right stat-arrow"></i>
    </div>

    <div class="stat-card pointer anim-rise" routerLink="/admin/posts" style="animation-delay: 60ms;">
      <div class="stat-icon icon-accent"><i class="fa-regular fa-images"></i></div>
      <div class="stat-meta">
        <div class="stat-label">Total posts</div>
        <div class="stat-value">{{ postCount }}</div>
      </div>
      <i class="fa-solid fa-arrow-right stat-arrow"></i>
    </div>

    <div class="stat-card anim-rise" style="animation-delay: 120ms;">
      <div class="stat-icon icon-info"><i class="fa-regular fa-message"></i></div>
      <div class="stat-meta">
        <div class="stat-label">Total messages</div>
        <div class="stat-value">{{ messageCount }}</div>
      </div>
    </div>
  </div>
</div>
