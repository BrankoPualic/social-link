<app-navigation />

<div class="admin-page">
  <div class="admin-page-header">
    <h2><i class="fa-solid fa-users"></i> Users</h2>
    <p>Manage and review all platform users.</p>
  </div>

  <div class="admin-toolbar">
    <app-search (onSearch)="onSearch($event)" [placeholder]="'Search users'" />
  </div>

  <div class="admin-grid-wrap">
    <app-grid [options]="gridOptions"></app-grid>
  </div>
</div>

<ng-template #userLinkCell let-row>
  <a [routerLink]="['/profile', row.id]" class="row-link">{{ row.id }}</a>
</ng-template>
<ng-template #dobCell let-row>
  <span>{{ row.dateOfBirth | date: 'mediumDate' }}</span>
</ng-template>
<ng-template #createdOnCell let-row>
  <span>{{ row.createdOn | date: 'MMM d, y h:mm a' }}</span>
</ng-template>
<ng-template #deleteCell let-row>
  <button class="btn btn-primary btn-icon me-1" type="button" (click)="changeActiveStatus(row)" [title]="getStatusTitle(row)">
    <i class="fa-solid" [class]="getStatusClass(row)"></i>
  </button>
  <button class="btn btn-primary btn-icon" type="button" (click)="changeLockStatus(row)" [title]="getLockTitle(row)">
    <i class="fa-solid" [class]="getLockClass(row)"></i>
  </button>
</ng-template>
