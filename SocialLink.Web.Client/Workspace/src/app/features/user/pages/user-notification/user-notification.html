<app-navigation />

<div class="user-notif-container">
  <div class="user-notif-card anim-rise">
    <div class="user-notif-header">
      <h2><i class="fa-regular fa-bell"></i> My notifications</h2>
      <p>Choose which notifications you want to receive.</p>
    </div>

    <form [formGroup]="form">
      @if (preferences)
      {
      <div formArrayName="preferences" class="user-notif-list">
        @for (notification of preferences.controls; track $index)
        {
        <div [formGroupName]="$index" class="user-notif-row">
          <div class="user-notif-name">{{ notification.value.name }}</div>
          <div class="user-notif-toggle">
            <span class="user-notif-toggle-label">{{ notification.value.isMuted ? 'Muted' : 'On' }}</span>
            <div class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" formControlName="isMuted" style="cursor: pointer" />
            </div>
          </div>
        </div>
        }
      </div>

      <div class="user-notif-actions">
        <button class="btn btn-outline-primary" type="button" [routerLink]="['/profile', userId]">Cancel</button>
        <button class="btn btn-primary" type="button" (click)="submit()">Save changes</button>
      </div>
      }
    </form>
  </div>
</div>
