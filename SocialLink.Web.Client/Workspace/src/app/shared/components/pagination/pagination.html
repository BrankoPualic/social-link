<div class="pagination-wrap d-inline-flex align-items-center">
  <button class="page-btn" (click)="setPage(1)" title="First page">
    <i class="fa-solid fa-angles-left"></i>
  </button>
  <button class="page-btn" (click)="setPage(options()?.currentPage! - 1)" title="Previous page">
    <i class="fa-solid fa-angle-left"></i>
  </button>

  @for (page of pages; track $index)
  {
  <button class="page-btn"
          [class.active]="page === options()?.currentPage"
          (click)="setPage(page)">
    {{ page }}
  </button>
  }

  <button class="page-btn" (click)="setPage(options()?.currentPage! + 1)" title="Next page">
    <i class="fa-solid fa-angle-right"></i>
  </button>
  <button class="page-btn" (click)="setPage(options()?.pageCount)" title="Last page">
    <i class="fa-solid fa-angles-right"></i>
  </button>
</div>
