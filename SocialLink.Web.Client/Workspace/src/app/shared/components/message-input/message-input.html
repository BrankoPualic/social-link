<div class="input-wrap">
  <textarea #textarea
            [(ngModel)]="value"
            (input)="autoResize()"
            rows="1"
            [placeholder]="placeholder()">
    </textarea>
  <button class="send-btn" type="button" (click)="send()" aria-label="Send">
    <i class="fa-solid fa-arrow-right"></i>
  </button>
</div>
